version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"     # published so the browser can reach it directly - see frontend/js/api.js
    volumes:
      - chat-data:/app/data   # persists the H2 file DB across container restarts

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  chat-data:
