<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Join screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>Simple Chat</h1>
      <input id="auth-username" placeholder="Pick a username" autocomplete="username">
      <button id="btn-join">Join</button>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- Main chat screen -->
  <div id="chat-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="me">
        <span id="me-username"></span>
        <span id="conn-status" class="status-dot" title="connection status"></span>
        <button id="btn-logout" title="Log out">&#x21bb;</button>
      </div>
      <ul id="contact-list"></ul>
    </aside>
    <main class="conversation">
      <header id="conv-header">Select a contact</header>
      <ul id="message-list"></ul>
      <form id="send-form">
        <input id="message-input" placeholder="Type a message..." autocomplete="off" disabled>
        <button type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

<script src="js/api.js"></script>
<script src="js/websocket-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
